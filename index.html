<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <form name="client-intake" data-netlify="true" enctype="multipart/form-data" hidden>
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="dob" />
      <input type="text" name="services" />
      <input type="text" name="isMinor" />
      <input type="text" name="parentFullName" />
      <input type="text" name="parentRelationship" />
      <input type="text" name="parentPhone" />
      <input type="text" name="parentEmail" />
      <input type="file" name="clientSignature" />
      <input type="file" name="parentSignature" />
      <textarea name="medicalInfo"></textarea>
      <textarea name="acknowledgments"></textarea>
      <textarea name="signatures"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
